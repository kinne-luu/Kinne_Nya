<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Irodori QR </title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kinne-luu/IrodoriQR/refs/heads/main/image/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="petals" aria-hidden="true"></div>
    <header>
        <h1><img class="logo" src="https://raw.githubusercontent.com/kinne-luu/IrodoriQR/refs/heads/main/image/logo.png" alt="">Irodori QR</h1>
        <div class="langs" id="langs"><button data-l="vi">Vie</button><button data-l="en">Eng</button><button data-l="ja">Jap</button></div>
    </header>
    <main>
        <div>
            <section>
                <h2 data-i="hQR">Mã QR</h2>
                <div class="tabs"><button id="t1" class="on" data-i="tabImg">Tải ảnh QR</button><button id="t2" data-i="tabTxt">Dán link / mã</button></div>
                <div id="p1">
                    <div class="drop" id="drop" data-zone="qr"><span data-i="dropQR">Kéo thả hoặc bấm để chọn ảnh QR</span><small data-i="paste">Ctrl + V để dán ảnh</small><input type="file" id="fQR"
                            accept="image/*" hidden></div>
                </div>
                <div id="p2" class="hide"><textarea id="raw" rows="3"
                        placeholder="Chuỗi Irodori QR hoặc đường link" data-ph="rawPh"></textarea></div>
                <div class="info" id="info"></div>
            </section>

            <section>
                <h2 data-i="hArt">Ảnh nền</h2>
                <div class="legend"><span><i class="d r"></i><span data-i="lgHigh">Ảnh hưởng lớn</span></span><span><i class="d y"></i><span data-i="lgMid">Vừa</span></span><span><i class="d g"></i><span data-i="lgLow">Nhỏ</span></span></div>
                <div class="drop" id="dropArt" data-zone="art"><span data-i="dropArt">Bấm hoặc kéo thả để chọn ảnh nền</span><small data-i="paste">Ctrl + V để dán ảnh</small></div><input type="file" id="fArt" accept="image/*" hidden>
                <div class="row3">
                    <div><label><span data-i="zoom">Phóng to</span> <b id="vZoom"></b></label><input type="range" id="zoom" min="50" max="250"
                            value="100"></div>
                    <div><label><span data-i="px">Dịch ngang</span> <b id="vPx"></b></label><input type="range" id="px" min="-100" max="100"
                            value="0"></div>
                    <div><label><span data-i="py">Dịch dọc</span> <b id="vPy"></b></label><input type="range" id="py" min="-100" max="100"
                            value="0"></div>
                </div>
                <div class="row">
                    <div><label><i class="d y"></i><span data-i="con">Tương phản</span> <b id="vCon"></b></label><input type="range" id="con" min="60" max="200"
                            value="110"></div>
                    <div><label><i class="d g"></i><span data-i="bri">Độ sáng</span> <b id="vBri"></b></label><input type="range" id="bri" min="-40" max="40"
                            value="0"></div>
                </div>
                <label><i class="d y"></i><span data-i="sharp">Độ nét</span> <b id="vSharp"></b></label><input type="range" id="sharp" min="0" max="100" value="30">
                <div class="hint" id="warnSharp" style="color:var(--bad)" data-i="warnSharp">Trên 50% dễ khó quét.</div>
            </section>

            <section>
                <h2 data-i="hPix">Pixel và độ bám mã</h2>
                <div class="legend"><span><i class="d r"></i><span data-i="lgHigh">Ảnh hưởng lớn</span></span><span><i class="d y"></i><span data-i="lgMid">Vừa</span></span><span><i class="d g"></i><span data-i="lgLow">Nhỏ</span></span></div>
                <div class="row">
                    <div><label><i class="d r"></i><span data-i="blk">Kích thước ô</span></label>
                        <select id="blk">
                            <option value="3">3×3</option>
                            <option value="4" selected>4×4</option>
                            <option value="5">5×5</option>
                            <option value="6">6×6</option>
                            <option value="8">8×8</option>
                        </select>
                    </div>
                    <div><label><i class="d y"></i><span data-i="pal">Bảng màu</span></label>
                        <select id="pal">
                            <option value="" data-i="palNone">Giữ nguyên</option>
                            <option value="pico" data-i="palPico">16 màu retro</option>
                            <option value="cyber" data-i="palCyber">Neon tím</option>
                            <option value="gb" data-i="palGb">Game Boy</option>
                        </select>
                    </div>
                </div>
                <label><i class="d r"></i><span data-i="lev">Độ bám mã</span> <b id="vLev"></b></label><input type="range" id="lev" min="30" max="100" value="60">
                <label><i class="d y"></i><span data-i="dep">Độ đậm chấm</span> <b id="vDep"></b></label><input type="range" id="dep" min="0" max="100" value="50">
                <label><i class="d y"></i><span data-i="blend">Độ hòa chấm và mắt định vị</span> <b id="vBlend"></b></label><input type="range" id="blend" min="0"
                    max="100" value="0">
                <label><i class="d g"></i><span data-i="halo">Vùng quanh chấm</span> <b id="vHalo"></b></label><input type="range" id="halo" min="0" max="60"
                    value="8">
                <div class="row">
                    <div><label><i class="d r"></i><span data-i="ver">Mật độ mã</span></label>
                        <select id="ver">
                            <option value="1" selected data-i="verMin">Nhỏ nhất</option>
                            <option value="8" data-i="ver8">Tối thiểu v8</option>
                            <option value="12" data-i="ver12">Tối thiểu v12</option>
                        </select>
                    </div>
                    <div><label><i class="d r"></i><span data-i="fnd">Ba mắt định vị</span></label>
                        <select id="fnd">
                            <option value="blend" selected data-i="fndBlend">Hòa theo ảnh</option>
                            <option value="classic" data-i="fndClassic">Đen trắng</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div><label><i class="d y"></i><span data-i="qz">Viền trống</span> <b id="vQz"></b></label><input type="range" id="qz" min="0" max="4"
                            value="1"></div>
                    <div><label><i class="d g"></i><span data-i="tim">Đường kẻ chấm</span> <b id="vTim"></b></label><input type="range" id="tim" min="0" max="100"
                            value="40"></div>
                </div>
                <div class="row">
                    <div><label><i class="d y"></i><span data-i="ecl">Sửa lỗi</span></label><select id="ecl">
                            <option value="1" selected>M</option>
                            <option value="2">Q</option>
                            <option value="3">H</option>
                        </select></div>
                    <div><label><i class="d y"></i><span data-i="skip">Bỏ ô xung đột</span> <b id="vSkip"></b></label><input type="range" id="skip" min="0" max="100"
                            value="20"></div>
                </div>
            </section>
        </div>

        <div>
            <div class="prev" id="prev">
                <div class="cv"><canvas id="cv" width="10" height="10"></canvas></div>
                <div class="stats"><span id="sSize"></span><span id="sVer"></span><span id="sLev"></span></div>
                <div class="status" id="st"></div>
                <button class="main" id="bDl" data-i="dl">Tải PNG</button>
                <div class="btns"><button id="bCp" data-i="cp">Sao chép ảnh</button><button id="bRs" data-i="rs">Đặt lại</button></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="foot-links">
            <a href="https://github.com/kinne-luu" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>GitHub</span>
            </a>
            <a href="https://www.facebook.com/kienmanhluu" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span>Facebook</span>
            </a>
            <a href="https://x.com/kienmanhluu" target="_blank" rel="noopener noreferrer" aria-label="X">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span>X</span>
            </a>
        </div>
        <div class="foot-by">Designed by <b>@#kinne_luu</b></div>
    </footer>

    <script src="./qr-engine.js"></script>
    <script src="./qr-art.js"></script>
    <script src="./qr-scanner.js"></script>
    <script src="./app.js"></script>
    <div class="mini" id="mini">
        <button class="grab" id="grab" type="button" aria-expanded="false" aria-label="Xem nhanh mã QR"></button>
        <div class="cv"><canvas id="cv2" width="10" height="10"></canvas></div>
    </div>

    <script>
        (function () {
            var m = document.getElementById('mini'), g = document.getElementById('grab'),
                src = document.getElementById('cv'), dst = document.getElementById('cv2'),
                prev = document.getElementById('prev'), ctx = dst.getContext('2d');
            var y0 = null, base = 0, closed = 0, dy = 0, moved = false, gone = false, raf = 0;
            function isOpen() { return m.classList.contains('open') }
            function paint() {
                if (src.width !== dst.width || src.height !== dst.height) { dst.width = src.width; dst.height = src.height }
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, dst.width, dst.height);
                ctx.drawImage(src, 0, 0);
            }
            function loop() { raf = 0; if (isOpen() && !gone) { paint(); raf = requestAnimationFrame(loop) } }
            function kick() { if (!raf) raf = requestAnimationFrame(loop) }
            function set(o) { m.classList.toggle('open', o); g.setAttribute('aria-expanded', o); if (o) kick() }
            g.addEventListener('click', function () { if (!moved) set(!isOpen()) });
            g.addEventListener('touchstart', function (e) {
                y0 = e.touches[0].clientY; dy = 0; moved = false;
                closed = m.offsetHeight - g.offsetHeight;
                base = isOpen() ? 0 : closed;
                paint();
            }, { passive: true });
            g.addEventListener('touchmove', function (e) {
                if (y0 === null) return;
                dy = e.touches[0].clientY - y0;
                if (Math.abs(dy) > 6) moved = true;
                if (!moved) return;
                m.style.transition = 'none';
                m.style.transform = 'translateY(' + Math.min(closed, Math.max(0, base + dy)) + 'px)';
                e.preventDefault();
            }, { passive: false });
            g.addEventListener('touchend', function () {
                if (y0 === null) return;
                y0 = null;
                m.style.transition = '';
                m.style.transform = '';
                if (moved) {
                    if (Math.abs(dy) > 40) set(dy < 0);
                    setTimeout(function () { moved = false }, 0);
                }
            });
            if ('IntersectionObserver' in window) {
                new IntersectionObserver(function (en) {
                    gone = en[0].isIntersecting;
                    m.classList.toggle('gone', gone);
                    if (!gone) kick();
                }, { rootMargin: '0px 0px -50px 0px' }).observe(prev);
            }
        })();
    </script>
</body>

</html>
